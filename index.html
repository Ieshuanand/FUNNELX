<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FUNNELX // Void-Scan Hyper-Scale Lead Intelligence</title>
    <meta name="description" content="FUNNELX — Next-generation multi-dimensional B2B lead extraction and CRM intelligence platform." />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Google Fonts including Playfair Display -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Space+Grotesk:wght@300;400;500;600;700;800;900&family=Geist:wght@100;300;400;500;600;700&family=JetBrains+Mono:wght@100;300;400;500;600;700&family=Oswald:wght@700&family=Neuton:wght@400&family=Syncopate:wght@400;700&display=swap" rel="stylesheet"/>
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- GSAP & ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <!-- Three.js r121 for Vanta.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
    <!-- Vanta Globe -->
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.globe.min.js"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary":            "#ffffff",
              "on-surface":         "#ffffff",
              "on-background":      "#ffffff",
              "background":         "#160505",
              "surface":            "#1a0808",
              "on-surface-variant": "#94a3b8",
              "outline":            "#f97316",
              "outline-variant":    "rgba(249,115,22,0.2)",
              "surface-container":  "#200909",
              "secondary":          "#fcd34d"
            },
            borderRadius: {
              "DEFAULT": "0px",
              "lg":      "2px",
              "xl":      "4px",
              "2xl":     "6px",
              "full":    "9999px"
            },
            fontFamily: {
              "headline-md":         ["Space Grotesk"],
              "body-rt":             ["Geist"],
              "display-lg":          ["Space Grotesk"],
              "label-mono":          ["JetBrains Mono"],
              "display-lg-mobile":   ["Space Grotesk"],
              "body-sm":             ["Geist"]
            },
            fontSize: {
              "headline-md":        ["24px", {"lineHeight":"1.3","fontWeight":"700"}],
              "body-rt":            ["16px", {"lineHeight":"1.6","fontWeight":"400"}],
              "display-lg":         ["48px", {"lineHeight":"1.05","letterSpacing":"-0.04em","fontWeight":"900"}],
              "label-mono":         ["12px", {"lineHeight":"1.0","letterSpacing":"0.12em","fontWeight":"600"}],
              "display-lg-mobile":  ["32px", {"lineHeight":"1.2","fontWeight":"800"}],
              "body-sm":            ["14px", {"lineHeight":"1.5","fontWeight":"400"}]
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#160505] text-white selection:bg-orange-500 selection:text-black overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
